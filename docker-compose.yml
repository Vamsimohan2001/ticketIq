# Optional: a PostgreSQL database instead of the built-in H2 file.
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=postgres  (in .env), then start the app as usual.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketiq
      POSTGRES_USER: ticketiq
      POSTGRES_PASSWORD: ticketiq
    ports:
      - "5432:5432"
    volumes:
      - ticketiq-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketiq"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ticketiq-pg:
